name: Apply audited fixes

on:
  push:
    branches:
      - fix/full-bug-audit-2026-09-16

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply remaining audited fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply source fixes
        run: python scripts/applyAuditFixes.py

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No remaining source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/pages/SettingsPage.jsx src/routes/admin.js src/routes/proxy.js src/lib/shopify.js
          git commit -m "Apply remaining audited fixes"
          git push
