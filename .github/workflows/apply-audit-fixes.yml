name: Apply audit fixes

on:
  push:
    branches:
      - fix/audit-settings-billing-hardening

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/audit-settings-billing-hardening
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply audit fixes
        run: node scripts/applyAuditFixes.mjs

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Remove one-shot automation
        run: |
          rm -f scripts/applyAuditFixes.mjs
          rm -f .github/workflows/apply-audit-fixes.yml

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix audited settings, billing, email and security issues"
          git push origin HEAD:fix/audit-settings-billing-hardening
