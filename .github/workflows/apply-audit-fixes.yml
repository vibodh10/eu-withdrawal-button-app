name: Apply audited fixes

on:
  push:
    branches:
      - fix/full-bug-audit-2026-09-16

permissions:
  contents: write

jobs:
  apply:
    if: "!startsWith(github.event.head_commit.message, 'Apply remaining audited fixes')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # Settings page: remove dead custom-template dependency, make settings+SMTP
          # a single save, and prevent side-actions from swallowing unrelated edits.
          path = "web/src/pages/SettingsPage.jsx"
          s = read(path)
          s = replace_once(s, '        emailSubject: "",\n        emailBody: "",\n', '', 'remove template fields')
          s = replace_once(s, '        emailSubject: form.emailSubject || "",\n        emailBody: form.emailBody || "",\n', '', 'remove template normalization')
          s = replace_once(s, '    const [templateLoaded, setTemplateLoaded] = useState(false);\n', '    const templateLoaded = true;\n', 'template loaded state')
          s = re.sub(
              r'\n    useEffect\(\(\) => \{\n        let cancelled = false;\n\n        async function loadTemplate\(\) \{.*?\n    \}, \[\]\);\n',
              '\n',
              s,
              count=1,
              flags=re.S,
          )
          if 'loadTemplate' in s:
              raise SystemExit('template loader removal failed')

          old_save = '''            await apiSend("/admin/settings", "PATCH", {
                brandingName: form.brandingName,
                locale: form.locale,
                enabledLanguages: form.enabledLanguages,
                brandingPrimaryColor: form.brandingPrimaryColor,
                merchantNotification: form.merchantNotification,
                legalPageUrl: form.legalPageUrl,
                privacyPageUrl: form.privacyPageUrl,
                supportEmail: form.supportEmail,
                withdrawalDays: form.withdrawalDays,
                emailDeliveryMethod: form.emailDeliveryMethod,
            });

            let savedSmtp = null;

            if (boot.isPro) {
                const smtpResponse = await apiSend("/admin/smtp", "PATCH", {
                    smtpEnabled: form.emailDeliveryMethod === "SMTP",
                    smtpHost: form.smtpHost,
                    smtpPort: Number(form.smtpPort),
                    smtpSecure: form.smtpSecure,
                    smtpUsername: form.smtpUsername,
                    smtpPassword: form.smtpPassword || undefined,
                    smtpFromName: form.smtpFromName,
                    smtpFromEmail: form.smtpFromEmail,
                });
                savedSmtp = smtpResponse.settings;
                await apiSend("/admin/email-templates/CONFIRMATION", "PATCH", {
                    subject: form.emailSubject || "",
                    bodyHtml: form.emailBody || "",
                });
            }
'''
          new_save = '''            const settingsResponse = await apiSend("/admin/settings", "PATCH", {
                brandingName: form.brandingName,
                locale: form.locale,
                enabledLanguages: form.enabledLanguages,
                brandingPrimaryColor: form.brandingPrimaryColor,
                merchantNotification: form.merchantNotification,
                legalPageUrl: form.legalPageUrl,
                privacyPageUrl: form.privacyPageUrl,
                supportEmail: form.supportEmail,
                withdrawalDays: form.withdrawalDays,
                emailDeliveryMethod: form.emailDeliveryMethod,
                ...(boot.isPro ? {
                    smtpEnabled: form.emailDeliveryMethod === "SMTP",
                    smtpHost: form.smtpHost,
                    smtpPort: Number(form.smtpPort),
                    smtpSecure: form.smtpSecure,
                    smtpUsername: form.smtpUsername,
                    smtpPassword: form.smtpPassword || undefined,
                    smtpFromName: form.smtpFromName,
                    smtpFromEmail: form.smtpFromEmail,
                } : {}),
            });

            const savedSmtp = boot.isPro ? settingsResponse.shop : null;
'''
          s = replace_once(s, old_save, new_save, 'atomic settings save')

          helper_anchor = '''    function clearError() {
        setState((current) => ({ ...current, error: "" }));
    }
'''
          helper = helper_anchor + '''
    function blockSideActionWhenDirty(action) {
        if (!hasUnsavedChanges) return false;
        setState((current) => ({
            ...current,
            error: `Save or discard your other settings before you ${action}.`,
        }));
        return true;
    }
'''
          s = replace_once(s, helper_anchor, helper, 'dirty side-action helper')

          for fn, action in [
              ('disconnectSmtp', 'disconnect SMTP'),
              ('createDomain', 'create a sending domain'),
              ('saveDomainSender', 'save the sender address'),
              ('removeDomain', 'remove the sending domain'),
          ]:
              anchor = f'    async function {fn}() {{\n'
              repl = anchor + f'        if (blockSideActionWhenDirty("{action}")) return;\n'
              s = replace_once(s, anchor, repl, f'{fn} dirty guard')

          refresh_anchor = '    async function refreshDomain() {\n'
          s = replace_once(
              s,
              refresh_anchor,
              refresh_anchor + '        if (hasUnsavedChanges) return;\n',
              'refresh domain dirty guard',
          )
          old_refresh_form = '''            setForm((current) => ({
                ...current,
                resendDomainName: settings.resendDomainName || current.resendDomainName,
                resendFromName: settings.resendFromName || current.resendFromName,
                resendFromEmail: settings.resendFromEmail || current.resendFromEmail,
            }));
'''
          new_refresh_form = '''            commitSavedForm({
                ...form,
                resendDomainName: settings.resendDomainName || form.resendDomainName,
                resendFromName: settings.resendFromName || form.resendFromName,
                resendFromEmail: settings.resendFromEmail || form.resendFromEmail,
            });
'''
          s = replace_once(s, old_refresh_form, new_refresh_form, 'refresh domain baseline')
          write(path, s)

          # Admin route: allow fresh cached access during transient Partner API failures,
          # save general+SMTP settings atomically, preserve exact SMTP passwords.
          path = "src/routes/admin.js"
          s = read(path)
          old_catch = '''    } catch (error) {
        console.error(
            "Partner API billing reconciliation failed:",
            error.message
        );
        return res.status(503).json({
            error: "Could not verify Shopify App Pricing entitlement.",
        });
    }
'''
          new_catch = '''    } catch (error) {
        console.error(
            "Partner API billing reconciliation failed:",
            error.message
        );

        // A transient Partner API failure must not take a merchant offline while
        // the locally cached entitlement is still valid. Paid cache freshness is
        // enforced by hasAppEntitlement/hasPaidEntitlement.
        if (hasAppEntitlement(req.shop)) {
            shop = req.shop;
        } else {
            return res.status(503).json({
                error: "Could not verify Shopify App Pricing entitlement.",
            });
        }
    }
'''
          s = replace_once(s, old_catch, new_catch, 'billing cached fallback')

          smtp_atomic = '''
    if (shopIsPro) {
      const smtpFieldsSubmitted = [
        "smtpEnabled",
        "smtpHost",
        "smtpPort",
        "smtpSecure",
        "smtpUsername",
        "smtpPassword",
        "smtpFromName",
        "smtpFromEmail",
      ].some((key) => Object.hasOwn(req.body, key));

      if (smtpFieldsSubmitted) {
        const enabled = Boolean(req.body.smtpEnabled);
        const host = String(req.body.smtpHost || "").trim();
        const username = String(req.body.smtpUsername || "").trim();
        const fromName = String(req.body.smtpFromName || "").trim();
        const fromEmail = String(req.body.smtpFromEmail || "").trim();
        const password = typeof req.body.smtpPassword === "string"
            ? req.body.smtpPassword
            : "";
        const port = Number.parseInt(req.body.smtpPort, 10);
        const secure = Boolean(req.body.smtpSecure);

        if (enabled) {
          if (!host) {
            return res.status(400).json({ error: "SMTP host is required." });
          }
          if (!isAllowedSmtpPort(port)) {
            return res.status(400).json({
              error: "SMTP verification is limited to ports 465 and 587.",
            });
          }
          if (!username) {
            return res.status(400).json({ error: "SMTP username is required." });
          }
          if (!fromEmail) {
            return res.status(400).json({ error: "From email is required." });
          }
          if (!password && !shop.smtpPasswordEncrypted) {
            return res.status(400).json({ error: "SMTP password is required." });
          }
        }

        const smtpConfigurationChanged =
            enabled !== Boolean(shop.smtpEnabled) ||
            host !== String(shop.smtpHost || "") ||
            (Number.isInteger(port) ? port : null) !== (shop.smtpPort ?? null) ||
            secure !== Boolean(shop.smtpSecure) ||
            username !== String(shop.smtpUsername || "") ||
            fromName !== String(shop.smtpFromName || "") ||
            fromEmail !== String(shop.smtpFromEmail || "") ||
            Boolean(password);

        Object.assign(patch, {
          smtpEnabled: enabled,
          smtpHost: host || null,
          smtpPort: Number.isInteger(port) ? port : null,
          smtpSecure: secure,
          smtpUsername: username || null,
          smtpFromName: fromName || null,
          smtpFromEmail: fromEmail || null,
          ...(smtpConfigurationChanged
              ? { smtpVerifiedAt: null, smtpLastError: null }
              : {}),
          ...(password
              ? { smtpPasswordEncrypted: encryptSecret(password) }
              : {}),
        });
      }
    }
'''
          cleaned_anchor = '''    const cleaned = Object.fromEntries(
'''
          s = replace_once(s, cleaned_anchor, smtp_atomic + '\n' + cleaned_anchor, 'atomic SMTP patch')
          old_settings_return = '''      return res.json({
          shop: publicShopView(updated),
      });
'''
          new_settings_return = '''      return res.json({
          shop: {
              ...publicShopView(updated),
              ...publicSmtpSettings(updated),
              ...publicResendDomainSettings(updated),
          },
      });
'''
          s = replace_once(s, old_settings_return, new_settings_return, 'settings response')
          s = replace_once(
              s,
              '''    const password =
        typeof smtpPassword === "string"
            ? smtpPassword.trim()
            : "";
''',
              '''    const password =
        typeof smtpPassword === "string"
            ? smtpPassword
            : "";
''',
              'exact SMTP password',
          )
          write(path, s)

          # Storefront settings must match the admin limits and actual confirmation behaviour.
          path = "src/routes/proxy.js"
          s = read(path)
          s = replace_once(
              s,
              '// Free users: English plus up to three additional languages.',
              '// Free users: English plus one additional language.',
              'proxy language comment',
          )
          s = replace_once(s, '].slice(0, 4);', '].slice(0, 2);', 'proxy language limit')
          old_confirmation = '''                /*
                 * The form remains available, but no automatic
                 * customer confirmation is currently sent.
                 */
                emailConfirmationsEnabled:
                    false,
'''
          new_confirmation = '''                // A verified withdrawal submission triggers the server-controlled
                // confirmation flow. Delivery can fall back between providers.
                emailConfirmationsEnabled:
                    true,
'''
          s = replace_once(s, old_confirmation, new_confirmation, 'confirmation settings flag')
          write(path, s)

          # Shopify billing/API configuration: one paid-handle source of truth,
          # one Admin API version, consistent scopes, and a real missing-ID check.
          path = "src/lib/shopify.js"
          s = read(path)
          s = replace_once(
              s,
              "const SHOPIFY_APP_HANDLE = process.env.SHOPIFY_APP_HANDLE || 'eu-withdrawal-button-2026';\n",
              "const SHOPIFY_APP_HANDLE = process.env.SHOPIFY_APP_HANDLE || 'eu-withdrawal-button-2026';\nconst SHOPIFY_ADMIN_API_VERSION = process.env.SHOPIFY_ADMIN_API_VERSION || '2026-04';\n",
              'admin API version const',
          )
          old_map = '''  const liveProHandle = String(
      process.env.SHOPIFY_MANAGED_PRICING_PRO_HANDLE || "pro"
  )
      .trim()
      .toLowerCase();

  const proHandles = new Set([
    liveProHandle,
    "pro-test",
  ]);

  return proHandles.has(value) ? "PRO" : "PAYMENT_REQUIRED";
'''
          s = replace_once(
              s,
              old_map,
              '  return isPaidPlanHandle(value) ? "PRO" : "PAYMENT_REQUIRED";\n',
              'paid handle source of truth',
          )
          s = replace_once(
              s,
              '`https://${normalizedShop}/admin/api/2026-01/graphql.json`',
              '`https://${normalizedShop}/admin/api/${SHOPIFY_ADMIN_API_VERSION}/graphql.json`',
              'admin GraphQL version',
          )
          s = replace_once(
              s,
              '  assertIdentityValue(localShop?.id, localShop?.id, "Admin Shop ID is missing");\n',
              '''  if (!localShop?.id) {
    throw new Error("Shopify billing identity mismatch: Admin Shop ID is missing");
  }
''',
              'shop identity missing check',
          )
          s = replace_once(
              s,
              "  scopes: ['read_orders'], // match your toml\n  hostName: process.env.APP_URL.replace(/https?:\\/\\//, ''),\n  apiVersion: \"2024-10\",\n",
              '''  scopes: String(
      process.env.SHOPIFY_SCOPES ||
      "read_orders,write_online_store_pages,write_app_proxy"
  ).split(",").map((scope) => scope.trim()).filter(Boolean),
  hostName: DEFAULT_APP_URL.replace(/https?:\\/\\//, ''),
  apiVersion: SHOPIFY_ADMIN_API_VERSION,
''',
              'SDK scopes and version',
          )
          write(path, s)

          # Keep documented scope source aligned with deployed TOML.
          path = ".env.example"
          s = read(path)
          if 'SHOPIFY_SCOPES=read_orders,write_online_store_pages,write_app_proxy' not in s:
              raise SystemExit('env scopes are not aligned')

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No remaining changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/pages/SettingsPage.jsx src/routes/admin.js src/routes/proxy.js src/lib/shopify.js
          git commit -m "Apply remaining audited fixes"
          git push
