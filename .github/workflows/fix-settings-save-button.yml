name: Fix settings save button

on:
  push:
    branches:
      - fix/settings-save-button

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply save button fix
        run: python scripts/fixSettingsSaveButton.py

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/pages/SettingsPage.jsx
          git commit -m "Add explicit settings save button"
          git push
