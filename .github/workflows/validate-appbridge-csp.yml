name: Validate App Bridge save bar CSP fix

on:
  push:
    branches:
      - fix/app-bridge-cdn-csp-savebar

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
